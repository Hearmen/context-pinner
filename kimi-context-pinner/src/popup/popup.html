<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Context Pinner</title>
    <link rel="stylesheet" href="./popup.css">
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Context Pinner</h1>
        <span id="status" class="status" aria-live="polite"></span>
      </header>

      <label class="field">
        <span>模板</span>
        <select id="templateSelect"></select>
      </label>

      <label class="toggle">
        <input id="enabledToggle" type="checkbox">
        <span>自动注入</span>
      </label>

      <label class="field">
        <span>名称</span>
        <input id="templateTitle" type="text" autocomplete="off">
      </label>

      <label class="field">
        <span>内容</span>
        <textarea id="templateBody" rows="8"></textarea>
      </label>

      <section class="skills" aria-label="模板 Skills">
        <label class="field">
          <span>导入 Skill</span>
          <input id="skillFileInput" type="file" accept=".md,.txt,text/markdown,text/plain">
        </label>

        <div id="skillsList" class="skills-list"></div>

        <div id="skillEditor" class="skill-editor" hidden>
          <label class="field">
            <span>Skill 名称</span>
            <input id="skillNameInput" type="text" autocomplete="off">
          </label>
          <label class="field">
            <span>Skill 内容</span>
            <textarea id="skillContentInput" rows="6"></textarea>
          </label>
          <div class="skill-editor-actions">
            <button id="skillDoneButton" type="button">完成</button>
            <button id="skillDeleteButton" type="button">删除 Skill</button>
          </div>
        </div>
      </section>

      <div class="actions">
        <button id="saveButton" type="button">保存</button>
        <button id="addButton" type="button">新增</button>
        <button id="duplicateButton" type="button">复制</button>
        <button id="deleteButton" type="button">删除</button>
      </div>
    </main>

    <script src="../shared/defaults.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="../shared/sites.js"></script>
    <script src="./active-tab.js"></script>
    <script src="./popup.js"></script>
  </body>
</html>
